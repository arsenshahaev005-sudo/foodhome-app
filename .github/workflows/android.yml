name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "bridge-contract/manifest.json"
      - "scripts/verify-phase-5-hardening.mjs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "bridge-contract/manifest.json"
      - "scripts/verify-phase-5-hardening.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Unit tests, lint, and unsigned build artifacts
        working-directory: android
        run: >-
          bash ./gradlew
          testDebugUnitTest
          lintDebug
          lintRelease
          assembleDebug
          assembleRelease
          assembleDebugAndroidTest
          --no-daemon
          --stacktrace
      - name: Enable KVM for Android UI smoke tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deterministic Android UI smoke tests
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
