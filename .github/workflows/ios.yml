name: iOS

on:
  workflow_dispatch:
    inputs:
      display:
        description: iPhone Dynamic Island display for App Store screenshots
        type: choice
        required: true
        default: large
        options:
          - medium
          - large
  # Required checks must run on every PR, including documentation-only changes.
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "bridge-contract/manifest.json"
      - "scripts/verify-phase-5-hardening.mjs"
      - "scripts/export-store-screenshots.py"
      - "scripts/test_store_screenshots.py"
      - "scripts/*ios*.py"
      - "scripts/ios_distribution.json"
      - "scripts/*testflight*"
      - "scripts/*staging-profiles*"
      - "scripts/app-store-connect.mjs"
      - ".github/workflows/testflight.yml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.display || 'large') || 'checks' }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 40
    # Keep the toolchain and simulator runtime paired; do not use runner defaults.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
      STORE_DISPLAY: ${{ inputs.display || 'large' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Inspect Xcode project
        run: plutil -lint ios/FoodHomeApp.xcodeproj/project.pbxproj
      - name: Read XML entitlements from a signed Mach-O
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/foodhome-entitlements.XXXXXX")
          printf '%s\n' 'int main(void) { return 0; }' | xcrun --sdk macosx clang -x c - -o "$scratch/app"
          python3 - "$scratch/expected.plist" <<'PY'
          import plistlib, sys
          from pathlib import Path
          values = {"application-identifier": "FIXTURE.market.foodhome.smoke", "aps-environment": "production"}
          Path(sys.argv[1]).write_bytes(plistlib.dumps(values))
          PY
          codesign --force --sign - --entitlements "$scratch/expected.plist" "$scratch/app"
          codesign --verify --strict "$scratch/app"
          codesign --display --entitlements - --xml "$scratch/app" | plutil -convert xml1 -o "$scratch/actual.plist" -
          python3 - "$scratch" <<'PY'
          import plistlib, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected = plistlib.loads((root / "expected.plist").read_bytes())
          actual = plistlib.loads((root / "actual.plist").read_bytes())
          if any(actual.get(name) != value for name, value in expected.items()):
              raise SystemExit("Signed Mach-O entitlements differ from the supplied fixture.")
          PY
      - name: Verify App Store screenshot dimensions
        run: python3 -B -m unittest discover -s scripts -p test_store_screenshots.py
      - name: Verify distribution targets, export options and App Store Connect responses
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_ios*.py'
          node --test scripts/testflight-distribution.test.mjs
      - name: Prepare pinned Xcode and iOS simulator
        id: simulator
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Pinned Xcode is missing: $DEVELOPER_DIR"
            exit 1
          fi
          sudo xcode-select --switch "$DEVELOPER_DIR"
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          xcrun simctl list devices available
          if ! xcrun simctl list runtimes --json | jq -e \
            --arg runtime "$IOS_SIMULATOR_RUNTIME" \
            '.runtimes | any(.identifier == $runtime and .isAvailable == true)' >/dev/null; then
            echo "::error::Pinned iOS simulator runtime is unavailable: $IOS_SIMULATOR_RUNTIME"
            exit 1
          fi
          # Create our own device: pre-created devices may be absent on fresh runners.
          device_type="$IOS_SIMULATOR_DEVICE_TYPE"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$STORE_DISPLAY" in
              medium) device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro ;;
              large) device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max ;;
              *) echo "::error::Unsupported screenshot display"; exit 1 ;;
            esac
          fi
          simulator_udid=$(xcrun simctl create "FoodHome-CI-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$device_type" "$IOS_SIMULATOR_RUNTIME")
          if [[ ! "$simulator_udid" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::simctl did not return a valid simulator identifier"
            exit 1
          fi
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
          xcodebuild -showdestinations -project ios/FoodHomeApp.xcodeproj -scheme FoodHomeApp
      - name: Build and run unit and UI smoke tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: >-
          xcodebuild
          -project ios/FoodHomeApp.xcodeproj
          -scheme FoodHomeApp
          -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -parallel-testing-enabled NO
          -skip-testing:FoodHomeAppUITests/AppStoreScreenshots
          -skip-testing:FoodHomeAppUITests/FoodHomeAppUITests/testInstalledStagingReleaseShowsShell
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Run staging unit tests and tap through the staging WebView
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild -project ios/FoodHomeApp.xcodeproj -scheme FoodHomeApp \
            -xcconfig "$GITHUB_WORKSPACE/ios/Config/Staging.xcconfig" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/foodhome-staging-tests" \
            -parallel-testing-enabled NO -only-testing:FoodHomeAppTests \
            -only-testing:FoodHomeAppUITests/FoodHomeAppUITests/testWebViewReachesBottomAndNavigationCanBeTapped \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build and verify production and staging Release apps
        shell: bash
        run: |
          set -euo pipefail
          for target in production staging; do
            build_dir="$RUNNER_TEMP/foodhome-release-$target"
            configuration=(-configuration Release)
            if [[ "$target" == staging ]]; then
              configuration+=(-xcconfig "$GITHUB_WORKSPACE/ios/Config/Staging.xcconfig")
            fi
            xcodebuild -project ios/FoodHomeApp.xcodeproj -scheme FoodHomeApp "${configuration[@]}" \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$build_dir" \
              CODE_SIGNING_ALLOWED=NO build
            python3 scripts/verify_ios_archive.py "$build_dir/Build/Products/Release-iphonesimulator/FoodHomeApp.app" "$target" internal
          done
      - name: Install both Release apps and open the staging shell on the same iPhone
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_FOODHOME_COINSTALL_RELEASE_TEST: "1"
        run: |
          set -euo pipefail
          for target in production staging; do
            xcrun simctl install "$SIMULATOR_UDID" "$RUNNER_TEMP/foodhome-release-$target/Build/Products/Release-iphonesimulator/FoodHomeApp.app"
          done
          production=$(xcrun simctl get_app_container "$SIMULATOR_UDID" market.foodhome.app app)
          staging=$(xcrun simctl get_app_container "$SIMULATOR_UDID" market.foodhome.app.staging app)
          [[ "$production" != "$staging" ]]
          python3 scripts/verify_ios_archive.py "$production" production internal
          python3 scripts/verify_ios_archive.py "$staging" staging internal
          expected=$(shasum -a 256 "$staging/FoodHomeApp" | cut -d' ' -f1)
          xcrun simctl launch "$SIMULATOR_UDID" market.foodhome.app.staging
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl setenv FOODHOME_COINSTALL_RELEASE_TEST 1
          # The production test host opens the separately installed staging Release by bundle ID.
          xcodebuild -project ios/FoodHomeApp.xcodeproj -scheme FoodHomeApp -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/foodhome-release-production" \
            -parallel-testing-enabled NO -only-testing:FoodHomeAppUITests/FoodHomeAppUITests/testInstalledStagingReleaseShowsShell \
            -resultBundlePath "$RUNNER_TEMP/staging-shell.xcresult" ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO test
          staging=$(xcrun simctl get_app_container "$SIMULATOR_UDID" market.foodhome.app.staging app)
          [[ "$(shasum -a 256 "$staging/FoodHomeApp" | cut -d' ' -f1)" == "$expected" ]]
          xcrun simctl get_app_container "$SIMULATOR_UDID" market.foodhome.app app >/dev/null
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/staging-shell.xcresult" --output-path "$RUNNER_TEMP/staging-shell"
          image=$(jq -er '[.[] | .attachments[] | select((.suggestedHumanReadableName // "") | startswith("foodhome-staging-release-shell")) | .exportedFileName] | if length == 1 then .[0] else error("Expected one staging screenshot") end' "$RUNNER_TEMP/staging-shell/manifest.json")
          [[ "$image" == *.png && "$image" != */* ]]
          cp "$RUNNER_TEMP/staging-shell/$image" "$RUNNER_TEMP/foodhome-staging-release-shell.png"
      - name: Save the staging Release screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-release-shell-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foodhome-staging-release-shell.png
          if-no-files-found: error
          retention-days: 7
      - name: Capture the Russian catalog and dish in the Release app
        id: store_capture
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_FOODHOME_CAPTURE_STORE_SCREENSHOTS: "1"
          TEST_RUNNER_FOODHOME_STORE_DISPLAY: ${{ inputs.display || 'large' }}
        run: |
          set -euo pipefail
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time 9:41 \
            --batteryState discharging --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl setenv FOODHOME_CAPTURE_STORE_SCREENSHOTS 1
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl setenv FOODHOME_STORE_DISPLAY "$STORE_DISPLAY"
          xcodebuild -project ios/FoodHomeApp.xcodeproj -scheme FoodHomeApp \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -testLanguage ru -testRegion RU -parallel-testing-enabled NO \
            -only-testing:FoodHomeAppUITests/AppStoreScreenshots/testGuestCatalogAndDish \
            -resultBundlePath "$RUNNER_TEMP/store.xcresult" \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/store-capture.log"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/store.xcresult" \
            --output-path "$RUNNER_TEMP/store-captures"
          python3 scripts/export-store-screenshots.py --display "$STORE_DISPLAY" \
            "$RUNNER_TEMP/store-captures" "$RUNNER_TEMP/app-store-ru"
      - name: Collect guest accessibility diagnostics
        if: failure() && github.event_name == 'workflow_dispatch' && steps.store_capture.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/store-guest-ax.txt"
          if [[ -f "$RUNNER_TEMP/store-capture.log" ]]; then
            sed -nE 's/^.*FOODHOME_STORE_AX (stage=(navigation|catalog|dish-card|dish)|(catalog_nav|dishes_heading|catalog_filters|open_links|address_sheet|consent_sheet|dish_photo)=[0-9]+)[[:space:]]*$/\1/p' \
              "$RUNNER_TEMP/store-capture.log" > "$report"
          fi
          if [[ ! -s "$report" ]]; then
            echo 'The capture did not record a guest accessibility snapshot.' > "$report"
          fi
      - name: Save guest accessibility diagnostics for the failed capture
        if: failure() && github.event_name == 'workflow_dispatch' && steps.store_capture.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-store-diagnostic-${{ inputs.display || 'large' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store-guest-ax.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save App Store screenshots for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-store-ru-iphone-16-${{ inputs.display || 'large' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-store-ru/*.jpg
          if-no-files-found: error
          retention-days: 14
